<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Health Diary Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

<aside class="sidebar">

    <h2>Health Diary</h2>

    <ul>

        <li onclick="window.location.href='dashboard.html'">
            🏠 Dashboard
        </li>

        <li onclick="window.location.href='meal.html'">
            🍽 Log Meal
        </li>

        <li onclick="window.location.href='meals.html'">
            📖 Meal History
        </li>

        <li onclick="window.location.href='medications.html'">
            💊 Medications
        </li>

        <li onclick="window.location.href='activities.html'">
            🚶 Activities
        </li>

        <li onclick="window.location.href='reports.html'">
            📊 Reports
        </li>

        <li onclick="window.location.href='settings.html'">
            ⚙ Settings
        </li>

    </ul>

</aside>

    <main class="content">

        <div class="header">

            <h1>Dashboard</h1>

            <button onclick="window.location.href='meal.html'">
                + Log Meal
            </button>

        </div>

        <div class="stats-grid">

            <div class="stat-card">
                <h3 id="mealCount">0</h3>
                <p>Meals Logged</p>
            </div>

            <div class="stat-card">
                <h3 id="avgGlucose">0</h3>
                <p>Average Glucose</p>
            </div>

            <div class="stat-card">
                <h3 id="highestGlucose">0</h3>
                <p>Highest Reading</p>
            </div>

            <div class="stat-card">
                <h3 id="latestMeal">None</h3>
                <p>Latest Meal</p>
            </div>

        </div>

<h2>Glucose Trend</h2>

<div class="chart-card">
    <canvas id="glucoseChart"></canvas>
</div>

        <h2>Last Meal</h2>

<div id="latestMealCard" class="meal-card">
    Loading...
</div>

        <h2>Recent Meals</h2>

        <div id="mealList">
            Loading...
        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="dashboard.js"></script>

</body>
</html>
