<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activities</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <h2>Health Diary</h2>
      </div>

      <nav>
        <ul class="nav-list">
          <li><a href="dashboard.html">🏠 Dashboard</a></li>
          <li><a href="meal.html">🍽 Log Meal</a></li>
          <li><a href="meals.html">📖 Meal History</a></li>
          <li><a href="medications.html">💊 Medications</a></li>
          <li><a href="activities.html" class="active">🚶 Activities</a></li>
          <li><a href="reports.html">📊 Reports</a></li>
          <li><a href="settings.html">⚙ Settings</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">
      <div class="page-header">
        <div>
          <p class="eyebrow">Movement</p>
          <h1>Activities</h1>
        </div>
        <a class="back-btn" href="dashboard.html">← Back</a>
      </div>

      <div class="panel">
        <h2>Log Activity</h2>
        <form id="activityForm" class="settings-grid">
          <div>
            <label>Activity</label>
            <input type="text" id="activityType" placeholder="Walk, Gym, Yoga" required />
          </div>
          <div>
            <label>Minutes</label>
            <input type="number" id="activityMinutes" min="1" placeholder="30" required />
          </div>
          <div>
            <label>Calories Burned</label>
            <input type="number" id="activityCalories" min="0" placeholder="180" />
          </div>
          <div>
            <label>Notes</label>
            <textarea id="activityNotes" rows="3" placeholder="Felt strong, easy pace..."></textarea>
          </div>
          <button type="submit" class="primary-btn">Save Activity</button>
        </form>
      </div>

      <div class="panel">
        <h2>Recent Activities</h2>
        <div id="activityList" class="stack-list"></div>
      </div>
    </main>
  </div>

  <script src="activities.js"></script>
</body>
</html>
