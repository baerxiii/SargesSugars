<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sarge's Sugars</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <h1>🩺 Sarge's Sugars</h1>

            <p class="subtitle">
                Track meals, glucose readings, photos, medications and progress.
            </p>

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <button
                class="login-btn"
                onclick="signIn()">
                Sign In
            </button>

            <button
                class="register-btn"
                onclick="signUp()">
                Create Account
            </button>

            <p id="message"></p>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

</body>

</html>
