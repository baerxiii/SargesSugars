<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Log Meal</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-page">

    <div class="meal-form-card">

        <h1>🍽 Log Meal</h1>

        <label>Food Name</label>

        <input
            type="text"
            id="food"
            placeholder="Eggs and Toast"
        >

        <label>Meal Type</label>

        <select id="mealType">
            <option>Breakfast</option>
            <option>Lunch</option>
            <option>Dinner</option>
            <option>Snack</option>
        </select>

        <label>📸 Meal Photo</label>

        <input
            type="file"
            id="photo"
            accept="image/*"
            capture="environment"
        >

        <img
            id="photoPreview"
            class="photo-preview"
            style="display:none;"
        >

        <label>Before Meal Glucose</label>

        <input
            type="number"
            id="glucoseBefore"
            min="2"
            max="30"
            step="0.1"
            placeholder="5.5"
        >

        <div id="beforeStatus"></div>

        <label>After Meal Glucose</label>

        <input
            type="number"
            id="glucoseAfter"
            min="2"
            max="30"
            step="0.1"
            placeholder="7.2"
        >

        <div id="afterStatus"></div>

        <label>Notes</label>

        <textarea
            id="notes"
            rows="5"
            placeholder="Notes..."
        ></textarea>

        <button
            class="save-btn"
            onclick="saveMeal()"
        >
            Save Meal
        </button>

        <div
            id="successMessage"
            class="success-message"
        >
            ✅ Meal Saved Successfully
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="meal.js"></script>

</body>
</html>
