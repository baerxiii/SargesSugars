<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log Meal</title>

    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <h2>Sarge's Sugars</h2>

            <ul>

                <li>
                    <a href="dashboard.html">
                        🏠 Dashboard
                    </a>
                </li>

                <li>
                    <a href="meal.html" class="active">
                        🍽 Log Meal
                    </a>
                </li>

                <li>
                    <a href="meals.html">
                        📖 Meal History
                    </a>
                </li>

                <li>
                    <a href="medications.html">
                        💊 Medications
                    </a>
                </li>

                <li>
                    <a href="activities.html">
                        🚶 Activities
                    </a>
                </li>

                <li>
                    <a href="reports.html">
                        📊 Reports
                    </a>
                </li>

                <li>
                    <a href="settings.html">
                        ⚙ Settings
                    </a>
                </li>

            </ul>

        </aside>

        <main class="content">

            <div class="page-header">

                <div>

                    <p class="eyebrow">
                        Meal Tracking
                    </p>

                    <h1>🍽 Log Meal</h1>

                </div>

                <a
                    class="back-btn"
                    href="dashboard.html">

                    ← Back

                </a>

            </div>

            <div class="form-page">

                <div class="meal-form-card">

                    <form id="mealForm">

                        <label for="food">
                            Food Name
                        </label>

                        <input
                            type="text"
                            id="food"
                            placeholder="Eggs and Toast"
                            required
                        >

                        <label for="mealType">
                            Meal Type
                        </label>

                        <select id="mealType">

                            <option>
                                Breakfast
                            </option>

                            <option>
                                Lunch
                            </option>

                            <option>
                                Dinner
                            </option>

                            <option>
                                Snack
                            </option>

                        </select>

                        <label for="photo">
                            📸 Meal Photo
                        </label>

                        <input
                            type="file"
                            id="photo"
                            accept="image/*"
                            capture="environment"
                        >

                        <img
                            id="photoPreview"
                            class="photo-preview"
                            alt="Meal preview"
                            style="display:none;"
                        >

                        <label for="glucoseBefore">
                            Before Meal Glucose
                        </label>

                        <input
                            type="number"
                            id="glucoseBefore"
                            min="2"
                            max="30"
                            step="0.1"
                            placeholder="5.5"
                            required
                        >

                        <div id="beforeStatus"></div>

                        <label for="glucoseAfter">
                            After Meal Glucose
                        </label>

                        <input
                            type="number"
                            id="glucoseAfter"
                            min="2"
                            max="30"
                            step="0.1"
                            placeholder="Leave blank and update later"
                        >

                        <div id="afterStatus"></div>
                        <p>
                            To receive a 2-hour reminder when this is blank,
                            <a href="settings.html">enable reminders in Settings</a>
                            before saving.
                        </p>

                        <label for="notes">
                            Notes
                        </label>

                        <textarea
                            id="notes"
                            rows="5"
                            placeholder="Notes..."
                        ></textarea>

                        <button
                            type="submit"
                            class="save-btn">

                            Save Meal

                        </button>

                        <div
                            id="successMessage"
                            class="success-message">

                            ✅ Meal Saved Successfully

                        </div>

                    </form>

                </div>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="meal.js"></script>

</body>

</html>
