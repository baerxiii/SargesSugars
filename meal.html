<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log Meal</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .meal-form-card {
      max-width: 720px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }
    .form-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-group label {
      font-weight: 600;
      color: #0f172a;
      font-size: 0.95rem;
    }
    .field-group input,
    .field-group select,
    .field-group textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      background: #ffffff;
      color: #0f172a;
    }
    .field-group input:focus,
    .field-group select:focus,
    .field-group textarea:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .two-col-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }
    .photo-box {
      padding: 12px;
      border: 1px dashed #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
    }
    .helper-note {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: #475569;
      line-height: 1.45;
    }
    .form-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }
    .submit-meal-btn {
      padding: 11px 20px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .submit-meal-btn:hover {
      background: #1d4ed8;
    }
    .secondary-cancel-link {
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <aside class="sidebar">
      <div class="brand-block">
        <h2>Health Diary</h2>
      </div>

      <nav>
        <ul class="nav-list">
          <li><a href="dashboard.html">🏠 Dashboard</a></li>
          <li><a href="meal.html" class="active">🍽 Log Meal</a></li>
          <li><a href="meals.html">📖 Meal History</a></li>
          <li><a href="medications.html">💊 Medications</a></li>
          <li><a href="activities.html">🚶 Activities</a></li>
          <li><a href="reports.html">📊 Reports</a></li>
          <li><a href="settings.html">⚙ Settings</a></li>
        </ul>
      </nav>
    </aside>

    <main class="content">
      <div class="page-header">
        <div>
          <p class="eyebrow">Meal Tracking</p>
          <h1 id="mealPageTitle">🍽 Log Meal</h1>
        </div>
        <a class="back-btn" href="meals.html">← Back</a>
      </div>

      <form id="mealForm" class="meal-form-card">
        <div class="form-section">
          <div class="field-group">
            <label for="foodName">Food Name</label>
            <input
              type="text"
              id="foodName"
              name="food_name"
              placeholder="e.g., Eggs and Toast"
              required
            />
          </div>

          <div class="field-group">
            <label for="mealType">Meal Type</label>
            <select id="mealType" name="meal_type">
              <option value="Breakfast">Breakfast</option>
              <option value="Lunch">Lunch</option>
              <option value="Dinner">Dinner</option>
              <option value="Snack">Snack</option>
            </select>
          </div>

          <div class="two-col-grid">
            <div class="field-group">
              <label for="glucoseBefore">Before Meal Glucose</label>
              <input
                type="number"
                id="glucoseBefore"
                name="glucose_before"
                step="0.1"
                min="1"
                max="40"
                placeholder="e.g., 5.5"
              />
            </div>

            <div class="field-group">
              <label for="glucoseAfter">After Meal Glucose (Optional)</label>
              <input
                type="number"
                id="glucoseAfter"
                name="glucose_after"
                step="0.1"
                min="1"
                max="40"
                placeholder="Leave blank and update later"
              />
            </div>
          </div>

          <p class="helper-note">
            To receive a 2-hour reminder when after-meal glucose is blank,
            <a href="settings.html">enable reminders in Settings</a> before saving.
          </p>

          <div class="field-group">
            <label for="mealNotes">Notes / Medication</label>
            <input
              type="text"
              id="mealNotes"
              name="notes"
              placeholder="e.g., Metformin or quick notes"
            />
          </div>

          <div class="field-group">
            <label for="mealPhoto">📷 Meal Photo (Optional)</label>
            <div class="photo-box">
              <input type="file" id="mealPhoto" name="photo" accept="image/*" />
              <img id="photoPreview" class="photo-preview" alt="Meal photo preview" />
            </div>
          </div>
        </div>

        <div id="formStatus" class="success-message" role="status"></div>

        <div class="form-actions">
          <button type="submit" id="submitMealBtn" class="submit-meal-btn">Save Meal</button>
          <a href="meals.html" class="secondary-cancel-link">Cancel</a>
        </div>
      </form>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="meal.js"></script>
</body>
</html>
